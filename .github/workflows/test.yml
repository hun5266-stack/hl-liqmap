name: offline-tests
on:
  push:
    paths: ['**.py', 'requirements.txt', '.github/workflows/test.yml', 'vps/*.sh']
  pull_request:
    paths: ['**.py', 'requirements.txt', '.github/workflows/test.yml', 'vps/*.sh']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n vps/run.sh
