name: collect

on:
  schedule:
    # GitHub 무료 스케줄러는 실행을 보장하지 않는다. 실측으로 절반 이상을
    # 건너뛰었고 공백이 7시간까지 벌어졌다. 시간당 네 번 걸어 잡힐 확률을 올리고,
    # 중복은 collect.py 의 MIN_GAP_MIN(45분)이 막는다.
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_dispatch:
    inputs:
      known_only:
        description: "전수 대신 기존 명단만 재조회 (빠름)"
        type: boolean
        default: false
      force:
        description: "최소 간격 무시하고 강제 실행"
        type: boolean
        default: false

# 전수 스캔이 길어져 다음 실행과 겹치면 건너뛰지 않고 기다린다.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        run: |
          ARGS=""
          [ "${{ inputs.known_only }}" != "true" ] && ARGS="$ARGS --full"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python collect.py $ARGS

      - name: 커밋
        run: |
          git config user.name  "hl-liqmap bot"
          git config user.email "actions@github.com"
          git add data latest.json holders.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && exit 0
              sleep 5
            done
            exit 1
          fi
