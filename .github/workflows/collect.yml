name: collect

on:
  schedule:
    # 매시 05분 전수 스캔. 정시는 러너 부하가 몰려 지연이 커진다.
    # 한 번에 약 18분이라 다음 실행까지 40분 이상 여유가 있다.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      known_only:
        description: "전수 대신 기존 명단만 재조회 (빠름)"
        type: boolean
        default: false

# 전수 스캔이 길어져 다음 실행과 겹치면 건너뛰지 않고 기다린다.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        run: |
          if [ "${{ inputs.known_only }}" = "true" ]; then
            python collect.py
          else
            python collect.py --full
          fi

      - name: 커밋
        run: |
          git config user.name  "hl-liqmap bot"
          git config user.email "actions@github.com"
          git add data latest.json holders.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && exit 0
              sleep 5
            done
            exit 1
          fi
